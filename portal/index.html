<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Vercel serves this page at /portal without a trailing slash. In that case,
  // make relative resources resolve from /portal/ instead of the site root.
  if (location.protocol !== 'file:' && /\/portal$/.test(location.pathname)) {
    var portalBase = document.createElement('base');
    portalBase.href = location.pathname + '/';
    document.head.appendChild(portalBase);
  }
</script>
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  #portal-root ::-webkit-scrollbar { display: none; }
  .h-scroll::-webkit-scrollbar { display: none; }
  .h-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  @media (min-width: 480px) {
    #portal-root { max-width: 390px !important; }
    .portal-member-center { max-width: 390px; margin-left: auto; margin-right: auto; }
  }
</style>
</helmet>

<div id="portal-root" style="width:100%;height:100dvh;margin:0 auto;background:#F6F6F6;font-family:'Noto Sans TC','Roboto',sans-serif;color:#3E3E3E;position:relative;display:flex;flex-direction:column;overflow:hidden;">
  <header style="flex-shrink:0;background:#FFFFFF;">
    <div style="height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #EEEEEE;">
      <img src="assets/logo.png" alt="王品集團" style="height:38px;width:auto;display:block;">
      <button onClick="{{ toggleMenu }}" aria-label="會員中心" style="border:none;background:none;padding:6px;margin-right:-6px;cursor:pointer;display:flex;"><img src="assets/icons/Icon_menu.svg" width="24" height="24" alt="menu"></button>
    </div>
  </header>

  <main style="flex:1;overflow-y:auto;padding:16px;background:#F6F7F8;">
    <div style="background:#FFFFFF;border-radius:16px;overflow:hidden;">
      <div style="position:relative;">
        <img src="assets/banner.jpg" alt="banner" style="width:100%;height:158px;object-fit:cover;display:block;">
        <div style="position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;">
          <span style="width:7px;height:7px;border-radius:50%;background:#DE052E;"></span>
          <span style="width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.85);"></span>
          <span style="width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.85);"></span>
        </div>
      </div>
    </div>

    <div style="margin:12px 0 18px;">
      <sc-if value="{{ funOut }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ onFunLogin }}" style="width:100%;background:#FFFFFF;border:1px solid #CCCCCC;border-radius:12px;padding:11px 20px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-family:inherit;">
          <img src="assets/icons/Icon_fun.svg" alt="" style="width:28px;height:28px;display:block;flex-shrink:0;">
          <span style="color:#333333;font-size:16px;font-weight:500;">登入瘋美食會員</span>
        </button>
      </sc-if>
      <sc-if value="{{ funIn }}" hint-placeholder-val="">
        <button onClick="{{ openFunMenu }}" style="width:100%;background:#FFEED8;border:1px solid #F0D1AA;border-radius:12px;padding:9px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;font-family:inherit;">
          <img src="assets/icons/Icon_fun.svg" alt="" style="width:28px;height:28px;display:block;flex-shrink:0;">
          <span style="flex:1;text-align:left;color:#8A5A1E;font-size:17px;font-weight:500;">查看瘋美食優惠</span>
          <img src="assets/icons/Icon_dropdown-right.svg" width="22" height="22" alt="">
        </button>
      </sc-if>
    </div>

    <section style="background:#FFFFFF;border-radius:20px;padding:18px 16px 20px;">
      <div style="display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:#111827;">
        <img src="assets/icons/Icon_locate.svg" width="24" height="24" alt="定位">
        <span>自動定位附近門市</span>
      </div>

      <div style="margin-top:18px;border:1.5px solid #E0E3E8;border-radius:14px;padding:20px 16px;background:linear-gradient(135deg,#FFFDFD 0%,#FFFFFF 100%);box-shadow:0 1px 2px rgba(0,0,0,.03);">
        <div style="display:flex;align-items:flex-start;gap:12px;">
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              <span style="font-size:22px;font-weight:700;color:#111827;">新莊建國一店</span>
              <span style="background:#FFF0F3;color:#E60032;font-size:13px;font-weight:700;padding:4px 9px;border-radius:6px;white-space:nowrap;">距離最近 350m</span>
            </div>
            <a href="https://www.google.com/maps/search/?api=1&amp;query=新北市新莊區建國一路69號" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;gap:5px;margin-top:10px;font-size:14px;color:#5F6673;text-decoration:none;">
              <img src="assets/icons/Icon_location.svg" width="18" height="18" alt="地址">
              <span>新北市新莊區建國一路69號</span>
            </a>
            <div style="margin-top:6px;font-size:14px;color:#9AA1AD;">今日營業時間：11:00 - 22:00</div>
          </div>

          <div style="width:76px;flex-shrink:0;border:1px solid #E4E7EC;border-radius:14px;padding:12px 6px 10px;text-align:center;background:#FFFFFF;">
            <div style="font-size:13px;font-weight:700;color:#9299A5;">目前候位</div>
            <div style="margin-top:4px;color:#E60032;font-size:42px;line-height:1;font-weight:700;">2</div>
            <div style="margin-top:7px;font-size:13px;color:#9299A5;">組等待中</div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px;">
          <a href="../index.html" style="height:54px;border:1.5px solid #E60032;border-radius:16px;background:#FFFFFF;color:#E60032;font-family:inherit;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;">我要外帶</a>
          <button style="height:54px;border:1.5px solid #E60032;border-radius:16px;background:#E60032;color:#FFFFFF;font-family:inherit;font-size:18px;font-weight:700;cursor:pointer;">前往取號</button>
        </div>
      </div>
    </section>

    <section style="margin-top:20px;">
      <h2 style="margin:0;font-size:21px;color:#111827;">門市列表</h2>
      <div class="h-scroll" style="display:flex;gap:10px;overflow-x:auto;margin-top:14px;padding-bottom:2px;">
        <sc-for list="{{ regions }}" as="region" hint-placeholder-count="7">
          <button onClick="{{ region.onSelect }}" style="{{ region.style }}">{{ region.label }}</button>
        </sc-for>
      </div>
      <div style="height:46px;margin-top:14px;background:#FFFFFF;border:1px solid #E0E3E8;border-radius:15px;display:flex;align-items:center;gap:10px;padding:0 14px;">
        <img src="assets/icons/Icon_search.svg" width="20" height="20" alt="search">
        <input value="{{ storeSearch }}" onChange="{{ onStoreSearch }}" onInput="{{ onStoreSearch }}" placeholder="搜尋門市名稱或地址..." style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;color:#333333;">
      </div>

      <div style="display:flex;flex-direction:column;gap:14px;margin-top:16px;">
        <sc-for list="{{ storeRows }}" as="store" hint-placeholder-count="3">
          <article style="background:#FFFFFF;border-radius:18px;padding:20px 16px;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
              <div style="flex:1;min-width:0;">
                <div style="font-size:20px;font-weight:700;color:#111827;">{{ store.name }}</div>
                <a href="{{ store.mapUrl }}" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;gap:5px;margin-top:9px;color:#5F6673;text-decoration:none;font-size:14px;">
                  <img src="assets/icons/Icon_location.svg" width="18" height="18" alt="地址"><span>{{ store.address }}</span>
                </a>
                <div style="margin-top:6px;color:#9AA1AD;font-size:14px;">今日營業時間：{{ store.hours }}</div>
              </div>
              <span style="background:#FFF0F3;color:#E60032;font-size:13px;font-weight:700;padding:6px 9px;border-radius:6px;white-space:nowrap;">開放取號</span>
            </div>
            <div style="height:1px;background:#F0F1F3;margin:18px 0 6px;"></div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="flex:1;color:#7B8492;font-size:15px;">目前候位 <b style="color:#E60032;font-size:23px;">{{ store.queue }}</b> 組</span>
              <a href="../index.html" style="height:42px;padding:0 18px;border:1.5px solid #E60032;border-radius:13px;background:#FFFFFF;color:#E60032;font-family:inherit;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;">我要外帶</a>
              <button style="height:42px;padding:0 18px;border:1.5px solid #E60032;border-radius:13px;background:#E60032;color:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;">前往取號</button>
            </div>
          </article>
        </sc-for>
      </div>
    </section>
  </main>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="">
    <div class="portal-member-center" style="position:fixed;inset:0;z-index:100;width:100%;background:#FFFFFF;display:flex;flex-direction:column;">
      <div style="height:64px;display:flex;align-items:center;justify-content:center;padding:0 24px;border-bottom:1px solid #EEEEEE;position:relative;flex-shrink:0;">
        <span style="font-size:20px;font-weight:700;color:#111111;">會員中心</span>
        <button onClick="{{ closeMenu }}" aria-label="關閉會員中心" style="position:absolute;right:18px;border:none;background:none;padding:6px;cursor:pointer;display:flex;">
          <img src="assets/icons/Icon_close.svg" width="24" height="24" alt="close">
        </button>
      </div>
      <div style="flex:1;overflow-y:auto;padding:24px;">
        <sc-if value="{{ lineOut }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ onLineLogin }}" style="width:100%;height:54px;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;background:#FFFFFF;border:1px solid #D9D9D9;border-radius:999px;cursor:pointer;font-family:inherit;">
            <img src="assets/icons/Icon_line.svg" width="26" height="26" alt="LINE"><span style="font-size:17px;font-weight:500;color:#111111;">點餐請先登入LINE</span>
          </button>
        </sc-if>
        <sc-if value="{{ lineIn }}" hint-placeholder-val="">
          <div style="font-size:22px;font-weight:700;color:#111111;margin:4px 0 12px;">Hi, Amy</div>
          <div style="height:52px;display:flex;align-items:center;gap:16px;cursor:pointer;"><img src="assets/icons/Icon_user_red.svg" width="28" height="28" alt=""><span style="flex:1;font-size:18px;color:#222222;">編輯會員資料</span><img src="assets/icons/Icon_dropdown-right.svg" width="22" height="22" alt=""></div>
          <a href="../order.html" style="height:52px;display:flex;align-items:center;gap:16px;text-decoration:none;cursor:pointer;"><img src="assets/icons/Icon_order.svg" width="28" height="28" alt=""><span style="flex:1;font-size:18px;color:#222222;">我的訂單</span><img src="assets/icons/Icon_dropdown-right.svg" width="22" height="22" alt=""></a>
          <div style="height:1px;background:#EEEEEE;margin:10px 0 24px;"></div>
        </sc-if>
        <sc-if value="{{ funIn }}" hint-placeholder-val="">
          <div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;"><span style="font-size:20px;font-weight:700;color:#111111;">瘋美食會員</span><button onClick="{{ onFunLogout }}" style="border:none;background:none;padding:2px;cursor:pointer;display:flex;"><img src="assets/icons/Icon_logout.svg" width="30" height="30" alt="登出"></button></div>
          <div style="height:52px;display:flex;align-items:center;gap:16px;"><img src="assets/icons/Icon_point.svg" width="30" height="30" alt=""><span style="font-size:18px;color:#222222;">瘋點數 <b style="color:#DE052E;">1,000</b> 點</span></div>
          <div style="height:52px;display:flex;align-items:center;gap:16px;"><img src="assets/icons/Icon_coupon.svg" width="30" height="30" alt=""><span style="font-size:18px;color:#222222;">優惠券 <b style="color:#DE052E;">1</b> 張</span></div>
          <div style="height:52px;display:flex;align-items:center;gap:16px;"><img src="assets/icons/Icon_gift-voucher.svg" width="30" height="30" alt=""><span style="font-size:18px;color:#222222;">電子禮券 <b>0</b> 張</span></div>
          <div style="height:1px;background:#EEEEEE;margin:14px 0 24px;"></div>
        </sc-if>
        <div style="font-size:20px;font-weight:700;color:#111111;margin-bottom:8px;">其他選單</div>
        <div style="height:52px;display:flex;align-items:center;gap:16px;cursor:pointer;"><img src="assets/icons/Icon_earth_red.svg" width="30" height="30" alt=""><span style="flex:1;font-size:18px;color:#222222;">語言選擇: 繁體中文</span><img src="assets/icons/Icon_dropdown-right.svg" width="22" height="22" alt=""></div>
        <sc-if value="{{ showLogout }}" hint-placeholder-val=""><button onClick="{{ logoutAll }}" style="width:100%;height:50px;margin-top:22px;border:1px solid #CCCCCC;border-radius:999px;background:#FFFFFF;font-family:inherit;font-size:17px;font-weight:500;color:#333333;cursor:pointer;">全部登出</button></sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    menuOpen: false,
    activeRegion: '全部',
    storeSearch: '',
    lineLoggedIn: (() => { try { return localStorage.getItem('lineMember') === '1'; } catch (e) { return false; } })(),
    funLoggedIn: (() => { try { return localStorage.getItem('funMember') === '1'; } catch (e) { return false; } })(),
  };

  renderVals() {
    const regionLabels = ['全部', '北北基', '桃竹苗', '中彰投', '雲嘉南', '高屏', '宜花東'];
    const regions = regionLabels.map(label => ({
      label,
      onSelect: () => this.setState({ activeRegion: label }),
      style: {
        flexShrink: 0, height: '40px', borderRadius: '999px', padding: '0 20px',
        border: this.state.activeRegion === label ? '1px solid #E60032' : '1px solid #DDE1E7',
        background: this.state.activeRegion === label ? '#E60032' : '#FFFFFF',
        color: this.state.activeRegion === label ? '#FFFFFF' : '#3E4652',
        fontFamily: 'inherit', fontSize: '15px', fontWeight: this.state.activeRegion === label ? '700' : '500',
        whiteSpace: 'nowrap', cursor: 'pointer',
      },
    }));
    const stores = [
      { region: '北北基', name: '新莊建國一店', address: '新北市新莊區建國一路69號', hours: '11:00 - 22:00', queue: 2 },
      { region: '桃竹苗', name: '中壢中山東店', address: '桃園市中壢區中山東路二段510號', hours: '11:00 - 22:00', queue: 4 },
      { region: '中彰投', name: '台中公益店', address: '台中市南屯區公益路二段51號', hours: '11:00 - 23:00', queue: 6 },
      { region: '雲嘉南', name: '台南西門店', address: '台南市中西區西門路一段658號', hours: '11:00 - 22:00', queue: 1 },
      { region: '高屏', name: '高雄博愛店', address: '高雄市左營區博愛二路777號', hours: '11:00 - 23:00', queue: 3 },
      { region: '宜花東', name: '花蓮中山店', address: '花蓮縣花蓮市中山路581號', hours: '11:00 - 21:30', queue: 0 },
    ];
    const keyword = this.state.storeSearch.trim().toLowerCase();
    const storeRows = stores
      .filter(store => this.state.activeRegion === '全部' || store.region === this.state.activeRegion)
      .filter(store => !keyword || store.name.toLowerCase().includes(keyword) || store.address.toLowerCase().includes(keyword))
      .map(store => ({ ...store, mapUrl: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(store.address) }));
    return {
      regions,
      storeRows,
      storeSearch: this.state.storeSearch,
      onStoreSearch: e => this.setState({ storeSearch: e.target.value }),
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      lineIn: this.state.lineLoggedIn,
      lineOut: !this.state.lineLoggedIn,
      funIn: this.state.funLoggedIn,
      funOut: !this.state.funLoggedIn,
      onLineLogin: () => { try { localStorage.setItem('lineMember', '1'); } catch (e) {} this.setState({ lineLoggedIn: true }); },
      onFunLogin: () => { try { localStorage.setItem('funMember', '1'); } catch (e) {} this.setState({ funLoggedIn: true }); },
      openFunMenu: () => this.setState({ menuOpen: true }),
      onFunLogout: () => { try { localStorage.removeItem('funMember'); } catch (e) {} this.setState({ funLoggedIn: false }); },
      showLogout: this.state.lineLoggedIn || this.state.funLoggedIn,
      logoutAll: () => { try { localStorage.removeItem('lineMember'); localStorage.removeItem('funMember'); } catch (e) {} this.setState({ lineLoggedIn: false, funLoggedIn: false, menuOpen: false }); },
    };
  }
}
</script>
</body>
</html>
